<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 290 80" width="290" height="80">
  <defs>
    <!-- Horizontal gradient for "Twyst" text matching CT.png blue tones -->
    <linearGradient id="tGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- CT monogram icon: 472×303 source → displayed at 87×56, centred vertically -->
  <image href="CT.png" x="0" y="12" width="87" height="56"/>

  <!-- Wordmark: "Cloud" light + "Twyst" bold blue -->
  <text y="52"
    font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="27">
    <tspan x="100" font-weight="300" fill="#374151">Cloud</tspan><tspan font-weight="700" fill="url(#tGrad)">Twyst</tspan>
  </text>
</svg>
